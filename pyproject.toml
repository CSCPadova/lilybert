[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lilybert"
version = "0.1.0"
description = "BERT-based MIR classification on LilyPond notation datasets"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Matteo Spanio", email = "spanio@dei.unipd.it"},
    {name = "Ilay Guler", email = "ilay2004@bu.edu"},
]
keywords = ["music", "ai", "bert", "lilypond", "classification", "mir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "peft>=0.5.0",
    "accelerate>=0.20.0",
    "datasets>=2.12.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "wandb>=0.15.0",
    "tensorboard>=2.13.0",
    "pyyaml>=6.0.0",
    "hydra-core>=1.3.2",
    "scikit-learn>=1.2.0",
    "tokenizers>=0.13.0",
    "huggingface-hub>=0.16.0",
    "python-ly>=0.9.9",
    "typer>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]

[project.urls]
"Homepage" = "https://github.com/CSCPadova/lilybert"
"Bug Tracker" = "https://github.com/CSCPadova/lilybert/issues"
"Repository" = "https://github.com/CSCPadova/lilybert"

[project.scripts]
lilybert = "lilybert.__main__:main"

[tool.hatchling.build.targets.wheel]
packages = ["lilybert"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["lilybert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]
