enabled: true
num_workers: 0  # 0 = auto (use all available CPUs)
input_dir: ${dataset.raw_dir}
output_dir: ${dataset.processed_dir}

augmentation:
  enable_transposition: false
  enable_absolute_relative: false
  enable_articulation_variants: false
  enable_barline_variants: false
  enable_retrograde: false
  enable_inversion: false
  include_original: true

tokenizer:
  enabled: false
  pretrained_model: ${model.pretrained_model}
  output_dir: ${dataset.tokenizer_path}

tokenize:
  enabled: false
  tokenizer_path: ${dataset.tokenizer_path}
  output_dir: ${dataset.pretokenized_shards_dir}
  max_length: 512
  stride: 256
  eval_ratio: 0.01
  seed: ${runtime.seed}

sharding:
  enabled: false
  tokenizer_path: ${dataset.tokenizer_path}
  output_dir: ${dataset.pretokenized_shards_dir}
  max_length: 2048
  stride: 256
  shard_size: 4096
  eval_ratio: 0.01
  seed: ${runtime.seed}
