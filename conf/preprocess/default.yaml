preprocess:
  enabled: true
  input_dir: ${dataset.raw_dir}
  output_dir: ${dataset.processed_dir}
  labels_path: ${dataset.labels_path}
  # Sections to strip from LilyPond source before processing.
  # Valid values: comments, header, scheme, layout, midi, version, markup, overrides, pagebreaks
  strip:
    - comments
    - header
    - scheme
    - overrides
    - pagebreaks
    - midi
    - version

  augmentation:
    enable_transposition: false
    enable_absolute_relative: false
    enable_articulation_variants: false
    enable_barline_variants: false
    enable_retrograde: false
    enable_inversion: false
    include_original: true

  bpe:
    enabled: false
    output_dir: ${dataset.tokenizer_path}
    vocab_size: 10000
    min_frequency: 40
    number_placeholders: false
    lexer:
      include_articulations: true
      include_slurs: true

  tokenize:
    enabled: false
    tokenizer_path: ${dataset.tokenizer_path}
    output_dir: artifacts/tokenized
    max_length: 512
    stride: 256
    eval_ratio: 0.01
    seed: ${runtime.seed}

  sharding:
    enabled: false
    tokenizer_path: ${dataset.tokenizer_path}
    output_dir: artifacts/pretokenized
    max_length: 2048
    stride: 256
    shard_size: 4096
    eval_ratio: 0.01
    seed: ${runtime.seed}
