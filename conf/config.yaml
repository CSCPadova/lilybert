defaults:
  - _self_
  - dataset: default
  - model: default
  - runtime: default
  - environment: local
  - preprocess: default

train:
  max_length: 2048
  mlm_probability: 0.15
  per_device_train_batch_size: 24
  per_device_eval_batch_size: 24
  num_train_epochs: 1
  learning_rate: 1e-4
  lr_scheduler_type: cosine
  grad_clip_norm: 1.0
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_steps: -1
  eval_steps: 200
  log_steps: 20
  logging_steps: 50
  save_steps: 500
  model_architecture: roberta-base
  random_init: false
  resume_from_checkpoint: null
