defaults:
  - _self_
  - dataset: default
  - model: default
  - runtime: default
  - environment: local
  - preprocess: default

train:
  max_length: 512
  mlm_probability: 0.15
  per_device_train_batch_size: 48
  per_device_eval_batch_size: 48
  num_train_epochs: 1
  learning_rate: 2e-4
  lr_scheduler_type: cosine
  grad_clip_norm: 1.0
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_steps: -1
  eval_steps: 1000
  log_steps: 20
  logging_steps: 50
  save_steps: 1000
  model_architecture: roberta-base
  random_init: false
  resume_from_checkpoint: null
  early_stopping: true
  early_stopping_patience: 5
  early_stopping_threshold: 0.01
  bf16: true
  gradient_accumulation_steps: 2
  optim: adamw_torch_fused
  dataloader_pin_memory: true
  save_total_limit: 3
  torch_compile: false
  ddp_find_unused_parameters: false
