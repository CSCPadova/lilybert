prepare_data: false
raw_input_dir: data/raw
labels_path: data/labels/labels_v1.json
data_dir: ${dataset.data_dir}
tokenizer_path: ${dataset.tokenizer_path}
output_dir: outputs/pretraining
model_architecture: bert-base
languages: ${augmentation.languages}
hidden_size: 768
num_hidden_layers: 12
num_attention_heads: 12
intermediate_size: 3072
max_position_embeddings: 512
max_length: 2048
mlm_probability: 0.15
per_device_train_batch_size: 16
num_train_epochs: 3
learning_rate: 5e-5
weight_decay: 0.01
warmup_ratio: 0.06
max_steps: 0
logging_steps: 50
save_steps: 500
seed: ${runtime.seed}
