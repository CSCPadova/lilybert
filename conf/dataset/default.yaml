data_dir: data/processed
tokenizer_path: artifacts/tokenizer_from_augmented
tokenizer_notation_mode: both
tokenizer_path_by_notation:
  english: artifacts/tokenizer_english
  italiano: artifacts/tokenizer_italiano
  both: artifacts/tokenizer
labels_path: data/labels/labels_v1.json
language: english
pretokenized_path: null
languages:
  - italiano
  - english
augmentation:
  languages:
    - italiano
    - english
  enable_transposition: false
  enable_absolute_relative: false
  enable_articulation_variants: false
  enable_barline_variants: false
  include_original: true
